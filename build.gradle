plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Loconautics и его зависимости нужны только для компиляции:
    // в игре они уже стоят отдельными модами, в наш jar они не попадают.
    // Положи в ./libs: loconautics-0.39.jar, а также jar'ы Create и Sable
    // (можно скопировать из libs проекта ColorfulLights).
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
