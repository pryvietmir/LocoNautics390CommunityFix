modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Loconautics Fixes"
authors="pryvietmir"
description='''
Неофициальный патч для Create: Loconautics 0.39.
Закрывает серверные эксплойты (подмена предметов, перенос чужих поездов),
краш двигателя без Create Propulsion, отладочные линии над вагонами,
утечку памяти клиента, спам отладочных логов,
невозможность ставить блоки и двигатели-призраки
на выделенном сервере.
Убирает обращения к клиентским классам на сервере (манометр на панели и др.),
чинит сцену ponder с предохранительным клапаном.
Не даёт колёсам сошедшей с рельс тележки проваливаться в землю
и оставаться на рельсах без вагона; опускает сошедший вагон на полблока.
Панели и подвижные детали больше не пропадают и не становятся розово-чёрными, порт. интерфейсы
на поездах работают через 2 блока, копикаты не выпадают в портале, поезда по расписанию
останавливаются у буферов Steam 'n' Rails.
Добавляет ponder-сцены для блоков Loconautics, у которых их не было.
'''

[[mixins]]
config="loconautics_fixes.mixins.json"

[[dependencies.loconautics_fixes]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.loconautics_fixes]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"

[[dependencies.loconautics_fixes]]
modId="loconautics"
type="required"
versionRange="[0.39,)"
ordering="AFTER"
side="BOTH"
